<text x="40" y="42" font-size="20" font-weight="bold" fill="#111111">KAMON — PLANCHE DE GRAMMAIRE DES VARIANTES</text>
<text x="40" y="64" font-size="12.5" fill="#444444">Le nom d un mon EST sa description. Ordre de lecture : [enceinte] ni [nombre][disposition][alteration][motif].</text>
<text x="40" y="82" font-size="12.5" fill="#444444">Motif temoin : le mitsu-uroko (trois ecailles), choisi parce qu il est purement geometrique — rien n y est approxime.</text>
