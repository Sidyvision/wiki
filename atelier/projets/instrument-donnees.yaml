# =============================================================================
# instrument-donnees.yaml — Déclaration applicative de l'Instrument (v0.3.3)
#
#   v0.3.3 (2026-08-04) : PHASE 3 OUVERTE. Premier nœud/ancrage transversal
#     (hors arbre-tradition) : sept Pôles/Aqtâb — hiérarchie initiatique
#     universelle, non rattachée à une tradition-arbre distincte (Guénon fait
#     autorité universelle, non fondateur d'un arbre propre — verdict Sidy
#     2026-08-04). 7 nœuds `universel/aqtab-*` (degrés 21-27) + 7 ancrages
#     equivalence/hozo vers les nœuds-degrés tasawwuf correspondants,
#     remplaçant l'ancrage placeholder à cible: null (v0.3.1). Voir
#     doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire
#     (clos, enrichi 2026-08-04) et architecture v0.3 §3.5 (nœud universel).
#     Corrige au passage la dérive de version constatée le 2026-08-04 :
#     l'en-tête indiquait encore v0.3.1 alors que le contenu (bloc zodiaque,
#     révision sept prophètes) reflétait déjà la révision du 2026-07-27 —
#     cf. doctrinal/annales.md, entrée [2026-08-04] signalement.
#   v0.3.1 (2026-07-17) : ajout d'un troisième ancrage établi — sept Pôles/Aqtâb
#     guénoniens ↔ Malakūt planétaire (degrés 21-27), verdict Sidy du 2026-07-16
#     (fiche doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire).
#     Cible laissée à null jusqu'à déclaration formelle (résolu en v0.3.3).
#   v0.3 (2026-07-01) : LES 28 NŒUDS-DEGRÉS (11-38) déclarés, la table étant
#     intégralement sourcée (addenda Gloton pp. 44-48 du 2026-07-01). Chaque
#     nœud-degré porte un `id` et un `label` déclarés (tous sourcent la même
#     fiche table-28-degres-nafas-rahman — surcharge prévue par le générateur).
#     Les degrés 1-10 (Hāhūt) ne sont PAS déclarés : vide invisible dans la
#     scène (spec technique de l'axe) ; à déclarer plus tard si besoin.
#   v0.2 : convention degre_vertical (échelle des 38 degrés ; null = traversant
#     ou structurant). — v0.1 : premiers nœuds + convergence des 28.
#
#   RÈGLES : étanchéité à sens unique vers doctrinal/ ; ancrage etabli TOUJOURS
#   sourcé (Cmd 5) ; subversion/parodie : cible null sauf discernement (v0.2 §2) ;
#   ce fichier DÉCLARE, le script VALIDE, l'app AFFICHE (Cmd 12).
# =============================================================================

noeuds:
  # ============ Nœuds notionnels (Tasawwuf) ============

  - fiche: doctrinal/symboles/hadarat-khams        # STRUCTURANT (loi de l'axe)
    tradition: tasawwuf
    degre_vertical: null

  - fiche: doctrinal/symboles/wahdat-al-wujud      # STRUCTURANT (doctrine)
    tradition: tasawwuf
    degre_vertical: null

  - fiche: doctrinal/symboles/barzakh              # BANDE Barzakh sup. (19-20)
    tradition: tasawwuf                            # principe général, nuance
    degre_vertical: 19.5                           # flaguée (v0.3 §3.4)

  - fiche: doctrinal/symboles/walaya               # TRAVERSANT (état/fonction)
    tradition: tasawwuf
    degre_vertical: null

  - fiche: doctrinal/symboles/al-insan-al-kamil    # TRAVERSANT confirmé ;
    tradition: tasawwuf                            # rendu filament VALIDÉ
    degre_vertical: null                           # (Sidy, 2026-07-01)

  - fiche: doctrinal/symboles/table-28-degres-nafas-rahman   # STRUCTURANT
    tradition: tasawwuf
    degre_vertical: null

  - fiche: doctrinal/symboles/manazil-al-qamar     # TRAVERSANT (28 demeures
    tradition: tasawwuf                            # ↔ 28 degrés lettrés)
    degre_vertical: null

  - fiche: doctrinal/symboles/nafas-rahmani        # TRAVERSANT (déploie 11-38)
    tradition: tasawwuf
    degre_vertical: null

  # ============ Les 28 nœuds-degrés (11-38) ============
  # Source unique : [[doctrinal/symboles/table-28-degres-nafas-rahman]],
  # colonnes sourcées Gloton pp. 44-48 (addenda du 2026-07-01).
  # Libellés : « n · lettre — Nom Divin (réalité) ». Manzil en commentaire.

  # --- Lāhūt (11-14) ---
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-11, degre_vertical: 11,
     label: "11 · hamza — al-Badîʿ (le Qalam suprême / Intellect Premier)"}   # Nattih, bélier
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-12, degre_vertical: 12,
     label: "12 · hâʾ — al-Bâʿith (la Table Gardée / Âme universelle)"}        # Batîn, bélier
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-13, degre_vertical: 13,
     label: "13 · ʿayn — al-Bâtin (la Nature universelle)"}                    # Thuryyâ, bélier/taureau
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-14, degre_vertical: 14,
     label: "14 · hâʾ — al-Âkhir (la Substance primordiale, al-habâʾ)"}        # Dabarân, taureau

  # --- Jabarūt (15-18) ---
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-15, degre_vertical: 15,
     label: "15 · ghayn — azh-Zhâhir (le Corps universel)"}                    # Haqʿa, taureau/gémeaux
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-16, degre_vertical: 16,
     label: "16 · khâʾ — al-Hakîm (la Conformation cosmique, al-shakl)"}       # Nahiyya/Hanʿa, gémeaux
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-17, degre_vertical: 17,
     label: "17 · qâf — al-Muhît (le Trône, ʿarsh)"}                           # Dhirâʿ, gémeaux
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-18, degre_vertical: 18,
     label: "18 · kâf — ash-Shakûr (le Piédestal, kursî)"}                     # Nathra, cancer

  # --- Barzakh supérieur (19-20, disques en rotation) ---
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-19, degre_vertical: 19,
     label: "19 · jîm — al-Ghaniyy (la Sphère sans étoiles, falak al-burûj)"}  # Tarf, cancer
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-20, degre_vertical: 20,
     label: "20 · shîn — al-Muqaddir (la Sphère des étoiles fixes)"}           # Jabha, cancer/lion

  # --- Malakūt planétaire (21-27) ---
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-21, degre_vertical: 21,
     label: "21 · yâʾ — ar-Rabb (Saturne — Abraham y siège)"}                  # Khurthân, lion
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-22, degre_vertical: 22,
     label: "22 · dâd — al-ʿAlîm (Jupiter — Moïse y siège)"}                   # Sarfa, lion/vierge
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-23, degre_vertical: 23,
     label: "23 · lâm — al-Qâhir (Mars — Aaron y siège)"}                      # ʿAwwâ, vierge
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-24, degre_vertical: 24,
     label: "24 · nûn — an-Nûr (Soleil — Idrîs y siège)"}                      # Simâk ʿaʿzal, vierge
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-25, degre_vertical: 25,
     label: "25 · râʾ — al-Musawwir (Vénus — Joseph y siège)"}                 # Ghafr, balance
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-26, degre_vertical: 26,
     label: "26 · tâʾ (ط) — al-Muhsî (Mercure — Jésus y siège)"}               # Zubbân, balance
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-27, degre_vertical: 27,
     label: "27 · dâl — al-Mubîn (Lune — Adam y siège)"}                       # Iklîl, balance/scorpion

  # --- Nāsūt (28-38, espacement exponentiel dans la scène) ---
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-28, degre_vertical: 28,
     label: "28 · tâʾ (ت) — al-Qabîd (le Feu)"}                                # Qalb, scorpion
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-29, degre_vertical: 29,
     label: "29 · zây — al-Hayy (l'Air)"}                                      # Shawla, scorpion/sagittaire
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-30, degre_vertical: 30,
     label: "30 · sîn — al-Muhyî (l'Eau)"}                                     # Naʿâʾim, sagittaire
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-31, degre_vertical: 31,
     label: "31 · sâd — al-Mumît (la Terre)"}                                  # Balda, sagittaire
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-32, degre_vertical: 32,
     label: "32 · zhâʾ — al-ʿAzîz (les Minéraux)"}                             # Dhâbih, capricorne
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-33, degre_vertical: 33,
     label: "33 · thâʾ — ar-Razzâq (les Végétaux)"}                            # Bulaʿ, capricorne
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-34, degre_vertical: 34,
     label: "34 · dhâl — al-Mudhdhil (les Animaux)"}                           # Suʿûd, capricorne/verseau
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-35, degre_vertical: 35,
     label: "35 · fâʾ — al-Qawiyy (les Anges)"}                                # ʿAkhbiya, verseau
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-36, degre_vertical: 36,
     label: "36 · bâʾ — al-Latîf (les Djinns)"}                                # Muqaddam, verseau/poisson
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-37, degre_vertical: 37,
     label: "37 · mîm — al-Jâmiʿ (l'Homme)"}                                   # Muʾakhkhar, poisson
  - {fiche: doctrinal/symboles/table-28-degres-nafas-rahman, tradition: tasawwuf,
     id: tasawwuf/degre-38, degre_vertical: 38,
     label: "38 · wâw — Rafîʿ ad-Darajât (l'Homme parfait)"}                   # Rishâ, poisson

  # ============ Les sept Aqtâb (hiérarchie initiatique universelle) ============
  # Nœuds UNIVERSELS (hors arbre-tradition) — voir architecture v0.3 §3.5.
  # Identité établie avec le Malakūt planétaire akbarien — verdict Sidy 2026-07-16/08-04
  # (doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire)
  - {fiche: doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire, tradition: universel,
     id: universel/aqtab-saturne, degre_vertical: 21, label: "Pôle de Saturne (Abraham y siège)"}
  - {fiche: doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire, tradition: universel,
     id: universel/aqtab-jupiter, degre_vertical: 22, label: "Pôle de Jupiter (Moïse y siège)"}
  - {fiche: doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire, tradition: universel,
     id: universel/aqtab-mars, degre_vertical: 23, label: "Pôle de Mars (Aaron y siège)"}
  - {fiche: doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire, tradition: universel,
     id: universel/aqtab-soleil, degre_vertical: 24, label: "Pôle du Soleil (Idrîs y siège)"}
  - {fiche: doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire, tradition: universel,
     id: universel/aqtab-venus, degre_vertical: 25, label: "Pôle de Vénus (Joseph y siège)"}
  - {fiche: doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire, tradition: universel,
     id: universel/aqtab-mercure, degre_vertical: 26, label: "Pôle de Mercure (Jésus y siège)"}
  - {fiche: doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire, tradition: universel,
     id: universel/aqtab-lune, degre_vertical: 27, label: "Pôle de la Lune (Adam y siège)"}

ancrages:
  # --- ⭐ Convergence des 28 (établie, Gem 2026-07-01, Futūḥāt ch. 198) ---
  - noeud: tasawwuf/table-28-degres-nafas-rahman
    type: equivalence
    etat: etabli
    directionnalite: none
    cible: tasawwuf/manazil-al-qamar
    source: "[[doctrinal/sources/ibn-arabi-de-la-mort-a-la-resurrection-gloton]]"
    note: "Convergence quadruple des 28 (fuçûç = lettres = degrés du Nafas al-Raḥmān = Manāzil al-Qamar), Futūḥāt ch. 198 §§11-38 ; validée Gem René Guénon 2026-07-01. Tableau synoptique pp. 44-48 intégralement transcrit."

  - noeud: tasawwuf/table-28-degres-nafas-rahman
    type: equivalence
    etat: etabli
    directionnalite: none
    cible: tasawwuf/nafas-rahmani
    source: "[[doctrinal/sources/ibn-arabi-de-la-mort-a-la-resurrection-gloton]]"
    note: "Les degrés 11-38 de la table SONT les 28 degrés lettrés du Nafas al-Raḥmān (même convergence, Futūḥāt ch. 198)."

  # --- ⭐ Sept Aqtâb (universel) ↔ Malakūt planétaire akbarien (établi, hozo, verdict Sidy 2026-07-16/08-04) ---
  - {noeud: universel/aqtab-saturne, type: equivalence, etat: etabli, directionnalite: none,
     cible: tasawwuf/degre-21, source: "[[doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire]]"}
  - {noeud: universel/aqtab-jupiter, type: equivalence, etat: etabli, directionnalite: none,
     cible: tasawwuf/degre-22, source: "[[doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire]]"}
  - {noeud: universel/aqtab-mars, type: equivalence, etat: etabli, directionnalite: none,
     cible: tasawwuf/degre-23, source: "[[doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire]]"}
  - {noeud: universel/aqtab-soleil, type: equivalence, etat: etabli, directionnalite: none,
     cible: tasawwuf/degre-24, source: "[[doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire]]",
     note: "Point de contrôle nommé : Guénon situe Idrîs au Ciel du Soleil (lettre à Coomaraswamy, 1936) — convergence directe, non construite, avec le degré 24 akbarien."}
  - {noeud: universel/aqtab-venus, type: equivalence, etat: etabli, directionnalite: none,
     cible: tasawwuf/degre-25, source: "[[doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire]]"}
  - {noeud: universel/aqtab-mercure, type: equivalence, etat: etabli, directionnalite: none,
     cible: tasawwuf/degre-26, source: "[[doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire]]"}
  - {noeud: universel/aqtab-lune, type: equivalence, etat: etabli, directionnalite: none,
     cible: tasawwuf/degre-27, source: "[[doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire]]"}

  # NOTE: Les sept Prophètes siégeant aux cieux planétaires (degrés 21-27) sont DOCUMENTÉS
  # dans la fiche discernement [[doctrinal/discernement/2026-07-27_septenaire-transversal-balance-degre-soleil]].
  # Ils ne constituent pas des ancrages au sens du manifeste (Cmd 13 — porte humaine).
  # Rapport Aqtâb↔Prophètes porte par le verdict discernement, non par le YAML du rendu Instrument.

zodiaque:
  degre_falak_al_buruj: 19       # 12 signes (Toit du Jardin paradisiaque)
  degre_falak_al_manazil: 20     # 28 Demeures lunaires (Terre des Jardins)
  obliquite_deg: 23.44            # inclinaison de l'écliptique (variable à l'échelle des cycles)
  epoque_reference: null          # à paramétrer en Phase 5 (époque de calcul astrologique)
