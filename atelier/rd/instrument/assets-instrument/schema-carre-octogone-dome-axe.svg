<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#111111" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

  <!-- ============================================================ -->
  <!-- TITRE / CARTOUCHE                                             -->
  <!-- ============================================================ -->
  <g font-size="16" fill="#111111">
    <text x="30" y="34" font-weight="bold" font-size="19">CARRÉ · OCTOGONE · DÔME — coupole sur trompes/pendentifs</text>
  </g>
  <g font-size="12.5" fill="#444444">
    <text x="30" y="54">Schéma de principe (NTS) d'après relevé photographique — Grande Mosquée de Paris, raw/IMG_9964.MOV (Sidy, 2026-08-29)</text>
    <text x="30" y="70">Référence doctrinale : René Guénon, « L'Octogone », Symboles de la Science sacrée, ch. XLII</text>
  </g>
  <line x1="30" y1="82" x2="1370" y2="82" stroke="#111111" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- COUPE / ÉLÉVATION (gauche) — murs à double ligne, hachure    -->
  <!-- ============================================================ -->
  <g>
    <text x="230" y="112" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">COUPE — élévation</text>

    <!-- Ligne de sol -->
    <line x1="60" y1="740" x2="480" y2="740" stroke="#111111" stroke-width="2"/>
    <g stroke="#111111" stroke-width="1">
      <line x1="45" y1="745" x2="60" y2="740"/><line x1="55" y1="745" x2="70" y2="740"/>
      <line x1="65" y1="745" x2="80" y2="740"/><line x1="75" y1="745" x2="90" y2="740"/>
    </g>

    <!-- Piédroits (murs), double ligne + hachure entre les deux faces -->
    <g stroke="#111111" stroke-width="1.6" fill="none">
      <path d="M120,740 L120,560 L136,560 L136,740 Z" fill="url(#hatch)"/>
      <path d="M344,740 L344,560 L360,560 L360,740 Z" fill="url(#hatch)"/>
    </g>

    <!-- Trompe / pendentif d'angle (coupe) -->
    <g stroke="#111111" stroke-width="1.6" fill="url(#hatch)">
      <path d="M136,560 Q 155,520 200,508 L212,522 Q 172,534 150,568 Z"/>
      <path d="M344,560 Q 325,520 280,508 L268,522 Q 308,534 330,568 Z"/>
    </g>

    <!-- Tambour octogonal (coupe) : montants + linteau, baie ajourée -->
    <g stroke="#111111" stroke-width="1.6" fill="none">
      <path d="M200,508 L200,400 L216,400 L216,508 Z" fill="url(#hatch)"/>
      <path d="M280,508 L280,400 L264,400 L264,508 Z" fill="url(#hatch)"/>
      <line x1="200" y1="400" x2="230" y2="372" stroke-width="1.6"/>
      <line x1="280" y1="400" x2="250" y2="372" stroke-width="1.6"/>
      <line x1="230" y1="372" x2="250" y2="372" stroke-width="1.6"/>
    </g>
    <!-- Baie à vitrail, coupe (embrasure) -->
    <g stroke="#111111" stroke-width="1.1" fill="none">
      <path d="M216,495 L216,415 Q 216,405 224,405 L232,405 Q 240,405 240,415 L240,495 Z"/>
      <line x1="216" y1="495" x2="216" y2="415" stroke-dasharray="3 3" stroke-width=".8"/>
    </g>

    <!-- Dôme (coupe) : double ligne (extrados/intrados) + côtes -->
    <path d="M200,372 A 96,150 0 0 1 280,372" stroke="#111111" stroke-width="1.6" fill="none"/>
    <path d="M212,376 A 84,132 0 0 1 268,376" stroke="#111111" stroke-width="1" fill="none"/>
    <g stroke="#777777" stroke-width=".8">
      <line x1="240" y1="230" x2="205" y2="368"/>
      <line x1="240" y1="230" x2="222" y2="360"/>
      <line x1="240" y1="230" x2="240" y2="356"/>
      <line x1="240" y1="230" x2="258" y2="360"/>
      <line x1="240" y1="230" x2="275" y2="368"/>
    </g>
    <circle cx="240" cy="230" r="7" stroke="#111111" stroke-width="1.6" fill="#ffffff"/>

    <!-- Axe -->
    <line x1="240" y1="222" x2="240" y2="740" stroke="#111111" stroke-width=".8" stroke-dasharray="1 5"/>
    <text x="150" y="200" font-size="10.5" fill="#555555">axe du Principe</text>
    <line x1="205" y1="197" x2="234" y2="228" stroke="#555555" stroke-width=".6"/>

    <!-- Cotation hauteur (fictive, NTS) -->
    <g stroke="#111111" stroke-width=".8">
      <line x1="500" y1="740" x2="500" y2="230"/>
      <line x1="493" y1="737" x2="507" y2="743"/>
      <line x1="493" y1="233" x2="507" y2="227"/>
      <line x1="480" y1="740" x2="505" y2="740"/>
      <line x1="480" y1="230" x2="505" y2="230"/>
    </g>
    <text x="510" y="490" font-size="10.5" fill="#555555" transform="rotate(90 510 490)" text-anchor="middle">h. NTS</text>

    <!-- Repères (numérotés, renvoi légende) -->
    <g font-size="12" fill="#111111">
      <circle cx="130" cy="650" r="10" fill="#ffffff" stroke="#111111" stroke-width="1"/><text x="130" y="654" text-anchor="middle">1</text>
      <circle cx="180" cy="540" r="10" fill="#ffffff" stroke="#111111" stroke-width="1"/><text x="180" y="544" text-anchor="middle">2</text>
      <circle cx="228" cy="450" r="10" fill="#ffffff" stroke="#111111" stroke-width="1"/><text x="228" y="454" text-anchor="middle">3</text>
      <circle cx="240" cy="300" r="10" fill="#ffffff" stroke="#111111" stroke-width="1"/><text x="240" y="304" text-anchor="middle">4</text>
      <circle cx="270" cy="240" r="10" fill="#ffffff" stroke="#111111" stroke-width="1"/><text x="270" y="244" text-anchor="middle">5</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- PLAN (droite) — carré, pendentifs d'angle, octogone inscrit  -->
  <!-- ============================================================ -->
  <g>
    <text x="880" y="112" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">PLAN — au niveau du tambour</text>

    <!-- Carré de base -->
    <rect x="700" y="180" width="360" height="360" fill="none" stroke="#111111" stroke-width="1.8"/>

    <!-- Pendentifs d'angle (triangles hachurés) -->
    <g fill="url(#hatch)" stroke="#111111" stroke-width="1.2">
      <path d="M700,180 L790,180 L700,270 Z"/>
      <path d="M1060,180 L970,180 L1060,270 Z"/>
      <path d="M700,540 L790,540 L700,450 Z"/>
      <path d="M1060,540 L970,540 L1060,450 Z"/>
    </g>

    <!-- Octogone inscrit (tambour), en trait seul — jamais de figure pleine -->
    <g stroke="#111111" stroke-width="2" fill="none">
      <polygon points="
        790,180 970,180
        1060,270 1060,450
        970,540 790,540
        700,450 700,270
      "/>
    </g>

    <!-- Baies (8), contour seul, positionnées au milieu de chaque pan -->
    <g stroke="#111111" stroke-width="1.1" fill="none">
      <rect x="855" y="172" width="50" height="10"/>
      <rect x="855" y="548" width="50" height="10"/>
      <rect x="692" y="335" width="10" height="50"/>
      <rect x="1058" y="335" width="10" height="50"/>
      <rect x="765" y="205" width="42" height="10" transform="rotate(45 786 210)"/>
      <rect x="953" y="205" width="42" height="10" transform="rotate(-45 974 210)"/>
      <rect x="765" y="505" width="42" height="10" transform="rotate(-45 786 510)"/>
      <rect x="953" y="505" width="42" height="10" transform="rotate(45 974 510)"/>
    </g>

    <!-- Axes de symétrie -->
    <g stroke="#555555" stroke-width=".7" stroke-dasharray="1 5">
      <line x1="880" y1="160" x2="880" y2="560"/>
      <line x1="680" y1="360" x2="1080" y2="360"/>
    </g>
    <circle cx="880" cy="360" r="5" stroke="#111111" stroke-width="1.4" fill="#ffffff"/>

    <!-- Repère numéroté -->
    <g font-size="12" fill="#111111">
      <circle cx="740" cy="220" r="10" fill="#ffffff" stroke="#111111" stroke-width="1"/><text x="740" y="224" text-anchor="middle">2</text>
      <circle cx="830" cy="180" r="10" fill="#ffffff" stroke="#111111" stroke-width="1"/><text x="830" y="184" text-anchor="middle">3</text>
    </g>

    <!-- Flèche nord (convention de plan) -->
    <g transform="translate(1120,200)">
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#111111" stroke-width="1.4"/>
      <polygon points="0,-40 -6,-28 6,-28" fill="#111111"/>
      <text x="0" y="16" font-size="10.5" text-anchor="middle" fill="#555555">N</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- LÉGENDE / NOMENCLATURE                                        -->
  <!-- ============================================================ -->
  <g font-size="12.5" fill="#111111">
    <text x="30" y="785" font-weight="bold">Nomenclature</text>
  </g>
  <g font-size="12" fill="#333333">
    <text x="30" y="805">1 — carré (base) : corps, état grossier/solide</text>
    <text x="30" y="822">2 — trompe / pendentif d'angle : transition carré → octogone</text>
    <text x="30" y="839">3 — octogone (tambour, 8 baies à vitrail) : âme, état intermédiaire/psychique — barzakh</text>
    <text x="30" y="856">4 — dôme (voûte à côtes rayonnantes) : esprit, états spirituels</text>
    <text x="30" y="873">5 — médaillon central / œil : axe du Principe, Centre du Monde</text>
  </g>
  <g font-size="11" fill="#777777">
    <text x="700" y="805">doctrinal/discernement/2026-08-29_octogone-monde-intermediaire-barzakh (validée)</text>
    <text x="700" y="820">doctrinal/discernement/2026-08-29_axe-du-monde-doctrine-transversale (validée)</text>
    <text x="700" y="835">atelier/rd/instrument/reference-visuelle-grande-mosquee-paris-dome-octogone.md</text>
    <text x="700" y="855">NTS — schéma de principe, non un relevé côté ; contour seul, aucune figure pleine (Instrument, prototype)</text>
  </g>
</svg>
