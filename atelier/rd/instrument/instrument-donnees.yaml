# =============================================================================
# instrument-donnees.yaml — Déclaration applicative de l'Instrument (v0.7.1)
#
#   v0.7.1 (2026-08-30) : AVALON. Deux corrections de rendu, l'une et l'autre
#     révélées par le test mécanique du prototype, non par relecture :
#     1. `canal_debut` / `canal_fin` — idâ et pingalâ courent du Mūlādhāra à
#        l'Ājñā, où elles « entrent dans la Sushumnâ » (Avalon, chap. V) ;
#        au-dessus, plus de latéralité. Le rendu les faisait courir sur toute
#        la hauteur du registre. Bornes nommées : Yuktatriveṇī / Muktatriveṇī.
#     2. `sens_rang` (ascendant | descendant) — `rang` enregistre l'ordre
#        PROPRE À CHAQUE TRADITION, et cet ordre n'a pas le même sens partout.
#        Faute de ce champ, le rendu supposait « rang 1 = sommet » pour tous et
#        plaçait le centre-RACINE à la couronne : hindouisme-tantra et vedanta
#        étaient rendus À L'ENVERS depuis le 2026-08-20.
#     Source : doctrinal/sources/avalon-serpent-power-nadis-reseau.md.
#
#   v0.7.0 (2026-08-30) : UNIFICATION DES AXES + champ `echelle`. Verdict de
#     Sidy : l'Axe du Monde, le filament de l'Insān al-Kāmil, le Pôle, la
#     colonne du milieu et sushumnâ sont UN SEUL axe sous des voiles distincts
#     (doctrinal/discernement/2026-08-30_unification-axes-verticaux-traditions).
#     Conséquence de rendu : les verticales parallèles du prototype sont un
#     même axe dessiné plusieurs fois — décalage ARTEFACT, à distinguer
#     rigoureusement du décalage DONNÉE (partitions non commensurables, ex.
#     12 signes / 28 manāzil), qui ne doit jamais être ajusté. Mode « axe
#     unifié » ajouté au prototype pour résorber le premier, jamais le second.
#     Nouveau champ `registres[].echelle` (macrocosmique | microcosmique |
#     transcalaire) : une comparaison inter-registres doit respecter l'échelle,
#     sous peine d'erreur de catégorie — c'est celle qui avait bloqué à tort le
#     rapprochement sept Pôles ↔ laṭāʾif (cieux planétaires = macrocosme,
#     laṭāʾif = microcosme). Voir rd/instrument/2026-08-30_reseau-subtil-
#     unification-axes-deux-echelles.md.
#
#   v0.6.0 (2026-08-29) : PREMIERS ANCRAGES INTER-REGISTRES. Deux verdicts de
#     Sidy rendus le 2026-08-29 : Ḥaḍarāt ↔ quatre états d'Âtmâ (4 ancrages
#     etabli, source Majmaʿ al-Bahrayn ch. VII) et Sephiroth ↔ chakras
#     (5 etabli + 2 suggere, réserve d'interversion de Guénon). Un troisième
#     verdict (sept Pôles ↔ sept laṭāʾif) est rendu mais NON déclarable :
#     conflit d'ordre entre les deux séries prophétiques, source manquante.
#
#   v0.5.2 (2026-08-25) : `zodiaque.mode_zodiaque` (tropical|sideral) et
#     `zodiaque.ayanamsha_deg` — verdict Sidy : l'Instrument exécute les DEUX
#     modes de référentiel zodiacal, commutables, pas un choix exclusif figé.
#     École d'ayanamsha pour le mode sidéral non arbitrée (point ouvert).
#     Voir rd/instrument/spec-anneau-zodiacal.md §3.3 et §7.3.
#   v0.5.1 (2026-08-25) : nouveau bloc `maisons:` — les 12 maisons
#     astrologiques (thème, terme arabe, qualité cardinale/succédante/
#     mutable). Domification GÉNÉRIQUE : le manifeste ne porte ni époque ni
#     lieu, donc aucun thème daté individuel n'est calculé ni affiché — la
#     table des 12 maisons, telle que sourcée, sert de graduation
#     supplémentaire du bezel zodiacal de l'Instrument (demande Sidy : « le
#     tout circonscrit par le bandeau zodiacal comme le bezel d'une montre
#     détaillant toutes les données par cran — signe, maison, etc. »).
#     Source : doctrinal/sources/fin-des-temps-modernes-ilm-al-nujum-bases-
#     mahdi-rouge.md (déjà au dépôt depuis le 2026-07-01 — c'est aussi la
#     source des « Angles de l'Espace », section IV du même article, déjà
#     rendus séparément dans la scène). Voir rd/instrument/angles-de-l-
#     espace.md pour le précédent de traitement de cette même source.
#   v0.5.0 (2026-08-20) : quatrième registre — vedanta (les quatre états
#     d'Âtmâ), sur demande de Sidy (« mettre en regard avec L'Homme et son
#     devenir selon le Vêdânta pour compléter »). Source :
#     doctrinal/sources/guenon-homme-devenir-vedanta-ch10-15-16-brahma-turiya.md
#     (ch. XII/XIII/XV/XVI, traditionnel) + guenon-homme-devenir-vedanta-ch9-14.md
#     (ch. XIV, Taijasa). 4 domaines en rang, colonne unique — Vaishwânara
#     (veille), Taijasa (rêve), Prājña (sommeil profond), Turīya (le
#     Quatrième, inconditionné).
#     Renommage : `hindouisme` → `hindouisme-tantra`, pour ne pas confondre
#     deux expositions distinctes de Guénon (Kundalinî-Yoga/chakras d'un
#     côté, États d'Âtmâ/Vêdânta de l'autre) sous un même id — cohérent avec
#     « une page = un sujet ».
#     ANCRAGE DÉCLARÉ (schéma manifeste v0.2.4, premier de son espèce) :
#     universel/homme-universel → vedanta/vaishvanara, etat: etabli. Ce n'est
#     PAS une correspondance inter-registres nouvelle : Vaishwânara fait DÉJÀ
#     partie de l'identité Adam Qadmôn = al-Insān al-Kāmil = Wang = Vaishwânara,
#     verdict clos le 2026-07-26
#     (doctrinal/discernement/2026-07-26_adam-qadmon-insan-kamil-wang-vaishvanara).
#     Le nœud universel/homme-universel a déjà cette source ; cet ancrage en
#     est la seconde branche déclarée (la première visait tasawwuf/al-insan-
#     al-kamil). Aucun autre domaine des registres — ni qabbalah, ni
#     hindouisme-tantra, ni les 3 autres domaines de vedanta — ne reçoit
#     d'ancrage : seule Vaishwânara est nommément comprise dans le verdict.
#     Voir rd/instrument/2026-08-20_instruction-branche-kabbale-phase3.md §7.
#   v0.4.1 (2026-08-20) : troisième registre — hindouisme (Vêdânta/Tantra), les
#     chakras sur sushumnā. Source : doctrinal/sources/guenon-kundalini-yoga-
#     etudes-hindouisme.md (status: traditionnel, déjà au dépôt depuis le
#     2026-07-14). 7 domaines en rang (6 chakras + sahasrāra, colonne unique —
#     tous sur l'axe central, à la différence de la Kabbale), aucun degré
#     akbarien attribué. Voir rd/instrument/2026-08-20_instruction-branche-
#     kabbale-phase3.md §5 pour le rapprochement Sephiroth/chakras que Guénon
#     énonce lui-même dans ce texte — signalé, non déclaré en ancrage (Cmd 3).
#   v0.4.0 (2026-08-20) : OUVERTURE DES REGISTRES. Nouveau bloc `registres:`.
#     Motif (redressement doctrinal de Sidy, 2026-08-20) : l'Instrument est la
#     représentation de l'UNIQUE Arbre Universel ; Arbre Universel et Homme
#     Universel sont équivalents dans le principe. L'identité
#     Insān Kāmil = Adam Qadmôn = Vaishwânara étant CLOSE (2026-07-26), il
#     s'agit du MÊME axe vertical — l'axe n'est donc pas à établir, il est
#     acquis. Sephiroth et chakras sont des centres décrivant des DOMAINES le
#     long de cet axe : chaque tradition orthodoxe partitionne le même axe
#     dans son expression propre, SANS devoir rendre une même notion par une
#     même expression, et SANS correspondance formelle point à point.
#     Un `registre` = la partition de l'axe propre à une tradition. Les
#     registres coexistent sans être alignés — même discipline que les 12
#     signes et les 28 manāzil de l'anneau zodiacal (Art. 3 sashimono,
#     jamais de joint forcé ; le décalage est une donnée, pas un défaut).
#     AUCUN ancrage inter-registres n'est déclaré ici : la correspondance
#     s'explicitera au fur et à mesure de la reconstitution de l'ensemble,
#     sous verdict (Cmd 3, Cmd 12). Déclarer un registre, c'est documenter une
#     tradition dans son expression propre — ce n'est poser aucun joint.
#     Voir rd/instrument/2026-08-20_instruction-branche-kabbale-phase3.md.
#   v0.3.4 (2026-08-20) : deuxième nœud universel déclaré — Homme Universel
#     (Adam Qadmôn = al-Insān al-Kāmil = Wang = Vaishwânara), discernement
#     déjà clos le 2026-07-26, jamais porté en donnée jusqu'ici (traduction
#     technique d'un verdict rendu, aucun nouvel arbitrage — Cmd 6). Voir
#     doctrinal/discernement/2026-07-26_adam-qadmon-insan-kamil-wang-vaishvanara
#     et rd/instrument/2026-08-20_etat-avancement-pistes-developpement.md.
#     Ajout également des 12 signes du zodiaque (`zodiaque.signes`), sourcés
#     de la « TABLE COMPLÈTE À QUATRE COLONNES » (colonne « Signe Zodiaque »,
#     doctrinal/symboles/table-28-degres-nafas-rahman.md, pp. 45-48 Gloton,
#     validation Gem 2026-07-01) — comble le point ouvert §7.4 de
#     rd/instrument/spec-anneau-zodiacal.md. Noms français uniquement (la
#     table source ne donne pas de nomenclature arabe des signes — non
#     inventée, cf. discipline des sources).
#   v0.3.3 (2026-08-04) : PHASE 3 OUVERTE. Premier nœud/ancrage transversal
#     (hors arbre-tradition) : sept Pôles/Aqtâb — hiérarchie initiatique
#     universelle, non rattachée à une tradition-arbre distincte (Guénon fait
#     autorité universelle, non fondateur d'un arbre propre — verdict Sidy
#     2026-08-04). 7 nœuds `universel/aqtab-*` (degrés 21-27) + 7 ancrages
#     equivalence/hozo vers les nœuds-degrés tasawwuf correspondants,
#     remplaçant l'ancrage placeholder à cible: null (v0.3.1). Voir
#     doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire
#     (clos, enrichi 2026-08-04) et architecture v0.3 §3.5 (nœud universel).
#     Corrige au passage la dérive de version constatée le 2026-08-04 :
#     l'en-tête indiquait encore v0.3.1 alors que le contenu (bloc zodiaque,
#     révision sept prophètes) reflétait déjà la révision du 2026-07-27 —
#     cf. doctrinal/annales.md, entrée [2026-08-04] signalement.
#   v0.3.1 (2026-07-17) : ajout d'un troisième ancrage établi — sept Pôles/Aqtâb
#     guénoniens ↔ Malakūt planétaire (degrés 21-27), verdict Sidy du 2026-07-16
#     (fiche doctrinal/discernement/2026-07-16_sept-poles-aqtab-malakut-planetaire).
#     Cible laissée à null jusqu'à déclaration formelle (résolu en v0.3.3).
#   v0.3 (2026-07-01) : LES 28 NŒUDS-DEGRÉS (11-38) déclarés, la table étant
#     intégralement sourcée (addenda Gloton pp. 44-48 du 2026-07-01). Chaque
#     nœud-degré porte un `id` et un `label` déclarés (tous sourcent la même
#     fiche table-28-degres-nafas-rahman — surcharge prévue par le générateur).
#     Les degrés 1-10 (Hāhūt) ne sont PAS déclarés : vide invisible dans la
#     scène (spec technique de l'axe) ; à déclarer plus tard si besoin.
#   v0.2 : convention degre_vertical (échelle des 38 degrés ; null = traversant
#     ou structurant). — v0.1 : premiers nœuds + convergence des 28.
#
#   RÈGLES : étanchéité à sens unique vers doctrinal/ ; ancrage etabli TOUJOURS
#   sourcé (Cmd 5) ; subversion/parodie : cible null sauf discernement (v0.2 §2) ;
#   ce fichier DÉCLARE, le script VALIDE, l'app AFFICHE (Cmd 12).
# =============================================================================

