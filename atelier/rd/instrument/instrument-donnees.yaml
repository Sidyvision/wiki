# =============================================================================
# REGISTRES — partitions de l'UNIQUE axe vertical, une par tradition
# =============================================================================
#
#   Un registre déclare comment une tradition orthodoxe partitionne le même axe
#   (celui de l'Homme Universel : Insān Kāmil = Adam Qadmôn = Wang = Vaishwânara,
#   identité close le 2026-07-26). Deux formes de domaine coexistent :
#
#     - `degres: [a, b]` — la tradition situe explicitement le domaine sur
#       l'échelle des 38 degrés (cas du tasawwuf akbarien, table de Gloton) ;
#     - `rang: n` + `colonne: …` — la tradition donne un ORDRE le long de l'axe
#       et une position latérale, sans échelle de degrés (cas de la qabbalah).
#       Le rendu répartit alors le registre sur l'étendue de l'axe SANS
#       prétendre l'aligner sur les degrés akbariens : la hauteur est un choix
#       de présentation, jamais une correspondance déclarée.
#
#   RÈGLE : aucun ancrage inter-registres n'est déclaré tant qu'un discernement
#   ne l'a pas tranché (Cmd 3). Déclarer un registre documente une tradition
#   dans son expression propre ; cela ne pose aucun joint.
# =============================================================================

registres:

  # --- Tasawwuf akbarien : l'axe des 38 degrés, partition en Ḥaḍarāt ---------
  # Reprend en donnée les « bandes » jusqu'ici codées en dur dans le prototype.
  - id: tasawwuf
    echelle: transcalaire          # voir rd/instrument/2026-08-30_reseau-subtil-unification-axes-deux-echelles.md §4.2
    echelle_note: "Degrés ontologiques : ni proprement cosmiques ni proprement humains."
    label: "Tasawwuf akbarien — les Ḥaḍarāt"
    fiche: doctrinal/symboles/hadarat-khams
    axe: principal              # occupe l'échelle des degrés elle-même
    domaines:
      - {id: tasawwuf/lahut, label: "Lāhūt", degres: [11, 14]}
      - {id: tasawwuf/jabarut, label: "Jabarūt", degres: [15, 18]}
      - {id: tasawwuf/barzakh-superieur, label: "Barzakh supérieur", degres: [19, 20]}
      - {id: tasawwuf/malakut-planetaire, label: "Malakūt planétaire", degres: [21, 27]}
      - {id: tasawwuf/nasut, label: "Nāsūt", degres: [28, 38]}

  # --- Qabbalah : l'Arbre séphirothique, 10 Sephiroth sur 3 colonnes --------
  # Structure sourcée : doctrinal/sources/kabbale-10-sefirot-structure.md
  # (status: traditionnel — Guénon via Vulliaud + texte primaire du Sefer
  # Yetsira, commentaire du Ramban). Rang et colonne repris tels quels de cette
  # fiche ; les couples droite/gauche de rangs adjacents occupent un même
  # niveau de l'axe, ce qui ramène les 10 Sephiroth à 7 niveaux — réduction
  # MÉCANIQUE (dérivée des colonnes déclarées), confirmée par ailleurs par
  # Guénon (Études sur l'Hindouisme, « Kundalinî-Yoga », § final).
  # AUCUN degré akbarien n'est attribué : la qabbalah ne les donne pas, et rien
  # ici ne prétend les aligner.
  - id: qabbalah
    sens_rang: descendant   # sens d'énumeration propre à la tradition — voir v0.7.1
    sens_rang_note: "Kether (rang 1) est la Couronne, au SOMMET ; Malkhut (rang 10) le Royaume, en bas. Énumération descendante."
    echelle: transcalaire          # voir rd/instrument/2026-08-30_reseau-subtil-unification-axes-deux-echelles.md §4.2
    echelle_note: "Émanations cosmiques, mais Guénon en prend la CORRESPONDANCE HUMAINE pour comparer aux chakras — d'où le caractère transcalaire."
    label: "Qabbalah — l'Arbre séphirothique"
    fiche: doctrinal/sources/kabbale-10-sefirot-structure
    axe: parallele              # ordre le long de l'axe, sans échelle de degrés
    # Colonnes enrichies le 2026-08-29 (soir). Guénon met les trois colonnes en
    # correspondance avec les trois nâdîs du registre hindouisme-tantra —
    # « l'axe central ou colonne du milieu, qui correspond à sushumnâ (les deux
    # colonnes latérales étant en relation avec idâ et pingalâ) » — et rapporte
    # Hokmah/Binah aux deux yeux droit et gauche, « correspondance microcosmique
    # du Soleil et de la Lune » (note 25). Correspondance ACQUISE DU TEXTE et
    # portée par le verdict Sephiroth↔chakras du 2026-08-29.
    # NON déclarée en ancrage : elle apparie des STRUCTURES DE LATÉRALITÉ, pas
    # des séries de centres — un schéma qui ne porte que des centres n'a rien à
    # en rendre. Documentée ici en donnée pour que la matière ne se perde pas.
    # Voir [[doctrinal/symboles/polarite-laterale-de-l-axe]].
    colonnes:
      milieu:
        label: "Colonne du milieu (Équilibre)"
        nadi_correspondant: sushumna
        correspondance_cosmique: "principe igné"
      droite:
        label: "Colonne de droite (Miséricorde)"
        nadi_correspondant: pingala
        correspondance_cosmique: "Soleil"
        note: "Hesed. Guénon rapporte « Miséricorde » et « Justice » aux deux bras, donc aux épaules — et aux deux anges de la tradition islamique qui y siègent (note 27)."
      gauche:
        label: "Colonne de gauche (Rigueur)"
        nadi_correspondant: ida
        correspondance_cosmique: "Lune"
        note: "Gevurah. Même symbolisme des deux bras/épaules."
    domaines:
      - {id: qabbalah/kether, label: "Kether — la Couronne", rang: 1, colonne: milieu, nom_divin: "Aïn-Soph (son vêtement)"}
      - {id: qabbalah/hokhma, label: "Hokhma — la Sagesse", rang: 2, colonne: droite, nom_divin: "Yah"}
      - {id: qabbalah/bina, label: "Bina — la Compréhension", rang: 3, colonne: gauche, nom_divin: "YHWH Elohim"}
      - {id: qabbalah/hesed, label: "Hesed — la Miséricorde", rang: 4, colonne: droite, nom_divin: "El"}
      - {id: qabbalah/gevurah, label: "Gevurah — la Force / Jugement", rang: 5, colonne: gauche, nom_divin: "Elohim"}
      - {id: qabbalah/tiferet, label: "Tiferet — la Beauté", rang: 6, colonne: milieu, nom_divin: "YHWH"}
      - {id: qabbalah/netzach, label: "Netzach — la Victoire", rang: 7, colonne: droite, nom_divin: "YHWH Tsevaot"}
      - {id: qabbalah/hod, label: "Hod — la Majesté", rang: 8, colonne: gauche, nom_divin: "Elohe Tsevaot"}
      - {id: qabbalah/yesod, label: "Yesod — le Fondement", rang: 9, colonne: milieu, nom_divin: "El Hai / El Shaddaï"}
      - {id: qabbalah/malkhut, label: "Malkhut — le Royaume", rang: 10, colonne: milieu, nom_divin: "Adonaï"}

  # --- Hindouisme (Tantra) : les chakras sur sushumnā -------------------------
  # Source : doctrinal/sources/guenon-kundalini-yoga-etudes-hindouisme.md
  # (status: traditionnel — Guénon, Études sur l'Hindouisme, « Kundalinî-Yoga »,
  # s'appuyant sur Arthur Avalon/John Woodroffe, The Serpent Power). Distinct du
  # registre `vedanta` ci-dessous (autre texte, autre doctrine — cf. v0.5.0).
  # Guénon rapporte lui-même (§19 du texte) les six chakras + sahasrāra aux
  # divisions de la colonne vertébrale, en ordre ascendant. Sahasrāra N'EST PAS
  # compté au nombre des chakras : « centre de conscience » au-delà des limites
  # de l'individualité (§21) — repris ici comme 7e domaine, distinct des six
  # chakras, fidèle à cette réserve du texte.
  # Tous les CENTRES sont sur l'axe central (sushumnā) : idā et pingalā sont des
  # CANAUX (nādīs), non des centres ; documentés ci-dessous pour mémoire, non
  # rendus comme domaines (le schéma des registres ne porte que des centres).
  # RECTIFICATION 2026-08-29 (soir) : ne pas en conclure, comme une première
  # rédaction l'avait fait, qu'aucune correspondance de latéralité n'existe avec
  # la Kabbale. Guénon écrit le contraire — la colonne du milieu « correspond à
  # sushumnâ », « les deux colonnes latérales étant en relation avec idâ et
  # pingalâ », et les canaux reliant les Sephiroth « ne sont pas sans analogie
  # avec les nâdîs ». Correspondance acquise du texte, non déclarée en donnée
  # (elle apparie des structures de latéralité, pas des séries de centres —
  # rien à rendre dans un schéma qui ne porte que des centres). Voir
  # [[doctrinal/discernement/2026-08-29_sephiroth-chakras-sept-niveaux]] §2.
  # Donnée non exploitée à ce jour : idâ ↔ Lune, pingalâ ↔ Soleil, sushumnâ ↔
  # principe igné.
  - id: hindouisme-tantra
    sens_rang: ascendant   # sens d'énumeration propre à la tradition — voir v0.7.1
    sens_rang_note: "Mūlādhāra (rang 1) est le centre-RACINE, à la BASE de la colonne ; Sahasrāra (rang 7) au sommet de la tête. Guénon énumère « dans le sens ascendant »."
    echelle: microcosmique          # voir rd/instrument/2026-08-30_reseau-subtil-unification-axes-deux-echelles.md §4.2
    echelle_note: "Centres « localisés » dans le corps humain (divisions de la colonne vertébrale). Leur pendant macrocosmique est la série des sept lokas, non déclarée."
    label: "Hindouisme (Tantra) — les chakras sur sushumnā"
    fiche: doctrinal/sources/guenon-kundalini-yoga-etudes-hindouisme
    axe: parallele
    # Canaux enrichis le 2026-08-29 (soir), sur le texte intégral de Guénon
    # désormais au dépôt. La correspondance cosmique (note 9) est une DONNÉE du
    # texte, non une construction : « idâ est rapportée à la Lune, pingalâ au
    # Soleil, et sushumnâ au principe igné ».
    # ⚠️ VIGILANCE POLAIRE/SOLAIRE — ne PAS rapprocher ces Soleil/Lune des
    # nœuds universel/aqtab-soleil (degré 24) et universel/aqtab-lune (degré 27) :
    # là, deux DEGRÉS superposés de l'axe ; ici, deux QUALITÉS de voies latérales
    # courant sur toute sa hauteur, n'occupant aucun rang. Homonymie de
    # symbolisme, pas un point d'ancrage. Aucun ancrage n'est déclaré entre les
    # deux séries. Voir [[doctrinal/symboles/polarite-laterale-de-l-axe]].
    canaux:
      # Champs `oeil` et `temps` versés le 2026-08-30 depuis Guénon, L'Homme et
      # son devenir selon le Vêdânta, ch. XX (= XXI en 1re ed. ; texte primaire) :
      # les deux luminaires y sont « les deux yeux de Vaishwânara », en relation
      # avec les deux nâdîs latéraux, tandis que sushumnâ « étant au milieu, est
      # en rapport avec le troisième œil, c'est-à-dire avec l'œil frontal de
      # Shiva ». La note 7 du même chapitre donne la valeur temporelle du
      # ternaire. Voir doctrinal/symboles/polarite-laterale-de-l-axe.md et
      # doctrinal/sources/guenon-homme-devenir-vedanta-ch20-artere-coronale-
      # rayon-solaire.md (consultation R&D, sens unique, signalée).
      sushumna:
        label: "canal central — porte les chakras eux-mêmes"
        cote: milieu
        correspondance_cosmique: "principe igné"
        oeil: "œil frontal de Shiva (le « troisième œil »)"
        temps: "le présent — « instant insaisissable, comparable au point géométrique sans dimensions »"
        note: "« Située » à l'intérieur de l'axe cérébro-spinal, jusqu'au Brahma-randhra. Ni solaire ni lunaire : tierce qualité propre. L'œil frontal et le « principe igné » ne sont pas deux données mais une seule, nommée deux fois : le regard du troisième œil « réduit tout en cendres »."
      pingala:
        label: "canal droit, masculin/positif"
        cote: droite
        correspondance_cosmique: "Soleil"
        colonne_sephirothique: droite
        oeil: "œil droit de Vaishwânara"
        temps: "le futur"
        note: "Extérieur à l'axe, enroulement hélicoïdal, aboutit à la narine droite. Guénon met la colonne séphirothique de droite (Miséricorde) en relation avec pingalâ ; Hokmah, en tête de cette colonne, est rapportée à l'œil droit, « correspondance microcosmique du Soleil » (note 25). Le ch. XX (= XXI en 1re ed.) ferme la boucle : ces deux yeux sont ceux de Vaishwânara."
      ida:
        label: "canal gauche, féminin/négatif"
        cote: gauche
        correspondance_cosmique: "Lune"
        colonne_sephirothique: gauche
        oeil: "œil gauche de Vaishwânara"
        temps: "le passé"
        note: "Extérieur à l'axe, enroulement hélicoïdal, aboutit à la narine gauche. Colonne séphirothique de gauche (Rigueur) ; Binah, en tête, rapportée à l'œil gauche, « correspondance microcosmique de la Lune » (note 25). Le ch. XX (= XXI en 1re ed.) ferme la boucle : ces deux yeux sont ceux de Vaishwânara."
    # Figuration traditionnelle du ternaire, donnée par Guénon : le caducée
    # (baguette centrale = sushumnâ, deux serpents = idâ/pingalâ) et le bâton
    # brahmanique (Brahma-danda) à sept nœuds figurant les sept lotus. Rapport
    # signalé par Guénon avec les trois « Grandes Lumières » maçonniques.
    figuration: "caducée · bâton brahmanique (Brahma-danda, sept nœuds) · Janus Bifrons (identité posée par Guénon, ch. XX (= XXI en 1re ed.) note 7)"

    # PROLONGEMENT DE L'AXE AU-DELÀ DE L'INDIVIDU — versé le 2026-08-30.
    # Guénon, ch. XX (= XXI en 1re ed.) : « Le rayon qui est en connexion avec l'artère coronale
    # est appelé AUSSI sushumnâ. » Le canal individuel et le rayon universel
    # portent le même nom ; le contact est « constant, aussi longtemps que le
    # corps subsiste », et la communication va dans les deux sens. Champ
    # DESCRIPTIF seulement : aucun rendu n'en dépend encore, aucun degré n'est
    # attribué au rayon — la tradition ne le situe pas sur une échelle.
    prolongement_axial:
      nom: "le « Rayon solaire »"
      identite_nominale: "porte le même nom que le canal central (sushumnâ)"
      nature: "particularisation, ou « polarisation », du principe supra-individuel Buddhi/Mahat"
      relie: "les états manifestés entre eux, et l'individualité à Âtmâ (le Soleil spirituel)"
      sens: "double — descendant (rayons de la Lumière intelligible vers l'artère) et réfléchi (de l'artère au Soleil)"
      source: "[[doctrinal/sources/guenon-homme-devenir-vedanta-ch20-artere-coronale-rayon-solaire]]"
    # BORNES DU PARCOURS LATÉRAL (Avalon, La Puissance du Serpent, chap. V) :
    # idâ et pingalâ courent du Mūlādhāra à l'Ājñā, où elles « entrent dans la
    # Sushumnâ ». Au-dessus d'Ājñā, plus de latéralité — seulement l'axe. C'est
    # aussi pourquoi la figure du caducée se forme avec les DEUX PÉTALES de
    # l'Ājñā Chakra. Les deux bornes sont nommées dans le texte :
    #   Mūlādhāra = Yuktatriveṇī (les trois « fleuves » s'y réunissent)
    #   Ājñā      = Muktatriveṇī (ils s'en écoulent séparément)
    # Corrige un rendu antérieur qui faisait courir les canaux sur toute la
    # hauteur du registre.
    canal_debut: hindouisme/muladhara
    canal_fin: hindouisme/ajna
    # Détail des centres versé le 2026-08-30 depuis la table synoptique d'Avalon
    # (La Puissance du Serpent, tableau des Chakra ; clichés déposés par Sidy).
    # Le total des pétales des SIX premiers fait 50 — nombre des lettres de
    # l'alphabet sanscrit, comme Guénon le relève. Sahasrāra les reprend toutes,
    # chacune répétée vingt fois (50 × 20 = 1000) : il ne figure donc pas dans
    # la table, étant au-delà de la série.
    # Ājñā/mandala comblé le 2026-08-30 (verdict Sidy) d'après la Planche VII
    # (« Ajna »), qui montre un triangle inversé — corroboré par la colonne
    # Liṅga/Yoni de la table synoptique elle-même (« Itara et Trikona »,
    # *trikona* = triangle), donc par une source textuelle distincte de la
    # seule planche. Voir `doctrinal/sources/avalon-serpent-power-nadis-reseau.md`,
    # section « Divergences entre la table synoptique et les planches ».
    # `couleur_tattva` reste VIDE : ni la table (Ājñā a pour tattva *Manas*,
    # hors des cinq éléments à couleur fixe) ni la planche ne donnent de
    # couleur pour ce centre — champ non comblé par conjecture.
    domaines:
      - {id: hindouisme/muladhara, label: "Mūlādhāra — centre-racine", rang: 1, colonne: milieu,
         position: "centre spinal de la région au-dessous des parties génitales",
         petales: 4, lettres: "va, sha, sha, sa",
         tattva: "Prithivî — cohésion, excitant le sens de l'odorat", couleur_tattva: "jaune",
         mandala: carre, bija: "Lang, sur l'éléphant", devata: "Brahmâ, sur Hamsa",
         shakti: "Dâkinî", linga: "Svayambhu et Traipura Trikona",
         autres_tattva: "Gandha Tattva ; l'odorat (organe de sensation) ; les pieds (organe d'action)"}
      - {id: hindouisme/swadhishthana, label: "Swādhishthāna", rang: 2, colonne: milieu,
         position: "centre spinal de la région au-dessus des parties génitales",
         petales: 6, lettres: "ba, bha, ma, ya, ra, la",
         tattva: "Ap — contraction, excitant le sens du goût", couleur_tattva: "blanc",
         mandala: croissant, bija: "Vang, sur Makara", devata: "Vishnu, sur Garuda",
         shakti: "Râkinî", linga: "",
         autres_tattva: "Rasa Tattva ; le goût (organe de sensation) ; la main (organe d'action)"}
      - {id: hindouisme/manipura, label: "Manipūra", rang: 3, colonne: milieu,
         position: "centre spinal de la région du nombril",
         petales: 10, lettres: "da, dha, na, ta, tha, da, dha, na, pâ, pha",
         tattva: "Tejas — expansion, produisant la chaleur, excitant le sens de la vue, des couleurs et des formes",
         couleur_tattva: "rouge",
         mandala: triangle, bija: "Rang, sur un bélier", devata: "Rudra, sur un taureau",
         shakti: "Lâkinî", linga: "",
         autres_tattva: "Rûpa Tattva ; la vue (organe de sensation) ; l'anus (organe d'action)"}
      - {id: hindouisme/anahata, label: "Anāhata — région du cœur", rang: 4, colonne: milieu,
         position: "centre spinal de la région du cœur",
         petales: 12, lettres: "ka, kha, ga, gha, nga, cha, chha, ja, jha, nya, ta, tha",
         tattva: "Vâyu — mouvement général, excitant le sens du toucher", couleur_tattva: "gris de fumée",
         mandala: hexagramme, bija: "Yang, sur une antilope", devata: "Ishâ",
         shakti: "Kâkinî", linga: "Bâna et Trikona",
         autres_tattva: "Sparsha Tattva ; le toucher (organe de sensation) ; le pénis (organe d'action)"}
      - {id: hindouisme/vishuddha, label: "Vishuddha — région de la gorge", rang: 5, colonne: milieu,
         position: "centre spinal de la région de la gorge",
         petales: 16, lettres: "les voyelles a, â, i, î, u, û, ri, rî, lri, lrî, e, ai, o, au, am, ah",
         tattva: "Akâsha — ouverture de l'espace, excitant le sens de l'ouïe", couleur_tattva: "blanc",
         mandala: cercle, bija: "Hang, sur un éléphant blanc", devata: "Sadâshiva",
         shakti: "Shâkinî", linga: "",
         autres_tattva: "Shabda Tattva ; l'ouïe (organe de sensation) ; la bouche (organe d'action)"}
      - {id: hindouisme/ajna, label: "Ājnā — le troisième œil", rang: 6, colonne: milieu,
         position: "centre de la région entre les sourcils",
         petales: 2, lettres: "ha et ksha",
         tattva: "Manas (facultés mentales)", couleur_tattva: "",
         mandala: "triangle inversé (pointe en bas), portant Oṃ, surmonté du croissant et du bindu — Planche VII, verdict Sidy 2026-08-30",
         bija: "Om", devata: "Shambhu",
         shakti: "Hâkinî", linga: "Itara et Trikona",
         autres_tattva: "Mahat, la Sûkshma Prakriti appelée Hiranyagarbha (Shatchakranirûpana, v. 52)"}
      - {id: hindouisme/sahasrara, label: "Sahasrāra — le lotus à mille pétales", rang: 7, colonne: milieu,
         position: "au sommet de la tête, autour du Brahma-randhra",
         petales: 1000,
         note: "Hors de la table synoptique d'Avalon : au-delà de la série des six. Guénon : « n'est pas compté au nombre des chakras », se rapportant « à un état qui est au-delà des limites de l'individualité ». Reprend les 50 lettres, chacune répétée vingt fois."}

  # --- Vêdânta : les quatre états (pâdas) d'Âtmâ ------------------------------
  # Source primaire : doctrinal/sources/guenon-homme-devenir-vedanta-ch10-15-16-
  # brahma-turiya.md (ch. XII cadre les 4 états, XIII = Vaishwânara/veille,
  # XV = Prājña/sommeil profond, XVI = Turīya) ; le nom Taijasa (rêve) vient de
  # guenon-homme-devenir-vedanta-ch9-14.md, ch. XIV — non déclarable en `fiche:`
  # unique (le schéma n'en porte qu'une par registre) ; cité en commentaire par
  # domaine, fiche des deux sources listée dans l'instruction associée.
  # D'après la Māṇḍūkya Upaniṣad (citée par Guénon, ch. XVI) : « Veille, rêve,
  # sommeil profond, et ce qui est au-delà, tels sont les quatre états d'Âtmâ ».
  # Colonne unique (milieu) : ce sont des états d'un même être, non des
  # positions latérales — aucune structure droite/gauche dans ce texte.
  # DISTINCT du registre `hindouisme-tantra` : autre ouvrage, autre doctrine
  # (États d'Âtmâ vs Kundalinî/chakras) — non fondu, malgré l'origine commune.
  - id: vedanta
    sens_rang: ascendant   # sens d'énumeration propre à la tradition — voir v0.7.1
    sens_rang_note: "Vaishwânara (rang 1) est la manifestation GROSSIÈRE, en bas ; Turīya (rang 4) l'inconditionné, au sommet."
    echelle: transcalaire          # voir rd/instrument/2026-08-30_reseau-subtil-unification-axes-deux-echelles.md §4.2
    echelle_note: "Vaishwânara est à la fois Virāj (macrocosme) et l'état de veille individuel (microcosme)."
    label: "Vêdânta — les quatre états (pâdas) d'Âtmâ"
    fiche: doctrinal/sources/guenon-homme-devenir-vedanta-ch10-15-16-brahma-turiya
    axe: parallele
    domaines:
      - {id: vedanta/vaishvanara, label: "Vaishwânara — l'état de veille (manifestation grossière)",
         rang: 1, colonne: milieu,
         note: "Identifié à Virâj, l'Intelligence cosmique régissant le monde corporel ; identité posée par Guénon avec l'Homme Universel (ch. XIII)."}
      - {id: vedanta/taijasa, label: "Taijasa — l'état de rêve (manifestation subtile)",
         rang: 2, colonne: milieu,
         note: "« Au cœur de la lumière » (ch. XIV, guenon-homme-devenir-vedanta-ch9-14.md)."}
      - {id: vedanta/prajna, label: "Prājña — le sommeil profond (état causal)",
         rang: 3, colonne: milieu,
         note: "État informel et supra-individuel, non « psychique » (ch. XV) ; identifié à Mūla-Prakriti."}
      - {id: vedanta/turiya, label: "Turīya — le Quatrième, état inconditionné",
         rang: 4, colonne: milieu,
         note: "« Invisible, non-agissant, incompréhensible, indéfinissable » (ch. XVI) ; les trois premiers pâdas ne comptent que pour un quart en importance métaphysique, le Quatrième vaut les trois autres quarts — asymétrie posée par le texte lui-même, non par ce dépôt."}
