name: Lint & Validate Wiki

# Le job s'appelle `lint` et ne doit PAS être renommé : c'est le contexte exigé
# par la protection de la branche `main` (`required_status_checks.contexts`).
# Le renommer laisserait la branche gardée par un contrôle qui n'existe plus.
#
# Réparé le 2026-09-01 (chantier PRO-01). Jusque-là, ce workflow parcourait un
# dossier `wiki/` et exigeait des dossiers `wiki/entities`, `wiki/concepts`,
# `wiki/schema`… — l'arborescence plate abandonnée par la Restauration Guénon V1
# du 2026-06-11. Aucun de ces chemins n'existe. Le job inspectait donc zéro
# fichier et affichait « Frontmatter OK » et « 0 avertissements » sur rien : un
# feu vert qui ne pouvait pas passer au rouge, exigé par la protection de `main`.
# Il gardait une porte en ne regardant jamais personne.
#
# Il exécute désormais les contrôles déterministes que le dépôt s'est réellement
# donnés (§VIII : sans LLM, sans réseau, le script est le seul verdict autorisé).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # verifier-invariants.py n'utilise que la bibliothèque standard : aucune
      # dépendance à installer, donc rien qui puisse casser le contrôle en amont
      # de ce qu'il contrôle.

      - name: Invariants du dépôt (bloquant)
        run: python3 verifier-invariants.py --racine .

      - name: Hygiène Unicode — Cmd 15 (bloquant)
        # Étendu le 2026-09-15 (verdict Sidy) : l'ancienne étape, écrite en
        # ligne, ne balayait que les `.md` suivis ; des `.py` porteurs
        # d'invisibles littéraux passaient. Même appel que le hook pre-push :
        # l'instrument unique du Cmd 15 (OUT-16), bibliothèque standard seule,
        # tous formats texte, registre d'exceptions déclarées honoré.
        run: python3 atelier/rd/outillage/verifier-hygiene-unicode.py --racine .

      - name: Cohérence de l'infrastructure déclarée (informatif)
        # Confronte les `infra_verif` des fiches à la configuration Hermes
        # réelle. Non bloquant en CI : le runner n'a pas accès aux profils
        # `/root/.hermes/` de la machine d'exécution, le contrôle n'y est donc
        # pas concluant. Il reste bloquant côté serveur, où il a du sens.
        run: |
          if [ -f atelier/rd/outillage/verifier-coherence-infrastructure.py ]; then
            python3 atelier/rd/outillage/verifier-coherence-infrastructure.py || true
          fi

      - name: Fichiers présents mais non suivis par git (informatif)
        run: |
          if [ -f atelier/rd/outillage/detecter-non-tracke.py ]; then
            python3 atelier/rd/outillage/detecter-non-tracke.py || true
          fi
