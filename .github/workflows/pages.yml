name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin

      - name: Prepare docs directory
        run: |
          mkdir -p docs
          # Copy markdown files and directories we want to publish
          cp README.md docs/
          cp -r doctrinal docs/ 2>/dev/null || true
          cp -r hermeneutique docs/ 2>/dev/null || true
          cp -r atelier docs/ 2>/dev/null || true
          cp -r label docs/ 2>/dev/null || true
          cp -r meta docs/ 2>/dev/null || true
          cp -r raw docs/ 2>/dev/null || true
          cp *.py docs/ 2>/dev/null || true
          cp *.json docs/ 2>/dev/null || true
          # Create index.md for each directory if missing
          find docs -type d | while read dir; do
            if [ ! -f "$dir/index.md" ] && [ "$dir" != "docs" ]; then
              name=$(basename "$dir")
              echo "# $name" > "$dir/index.md"
              echo "" >> "$dir/index.md"
              echo "Contenu du dossier \`$name\`." >> "$dir/index.md"
            fi
          done

      - name: Generate mkdocs.yml
        run: |
          cat > mkdocs.yml << 'MKDOCS_EOF'
          site_name: Wiki Sidyvision
          site_description: Wiki personnel structuré
          repo_url: https://github.com/Sidyvision/wiki
          theme:
            name: material
            language: fr
            features:
              - navigation.tabs
              - navigation.sections
              - navigation.expand
              - search.highlight
              - search.share
          plugins:
            - search
            - git-revision-date-localized:
                type: date
          markdown_extensions:
            - admonition
            - pymdownx.details
            - pymdownx.superfences
            - toc:
                permalink: true
          nav:
            - Accueil: README.md
            - Entités: doctrinal/index.md
            - Concepts: hermeneutique/index.md
            - Atelier: atelier/index.md
            - Label: label/index.md
            - Meta: meta/index.md
            - Raw: raw/index.md
          MKDOCS_EOF

      - name: Build
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
